<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-grad-j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8ff"/>
    </linearGradient>
    <filter id="shadow-sm-j">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-md-j">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="720" fill="url(#bg-grad-j)" rx="12"/>

  <!-- ===== TITLE ===== -->
  <text x="195" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6" letter-spacing="4">REFLECT</text>
  <text x="195" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#1a1a2e" letter-spacing="-1">Journals</text>
  <text x="195" y="96" text-anchor="middle" font-size="13" fill="#6b7280">Private reflection. AI finds what you missed.</text>
  <line x1="155" y1="110" x2="235" y2="110" stroke="#ede9fe" stroke-width="2"/>

  <!-- ===== JOURNAL NOTEBOOK ===== -->
  <g transform="translate(20, 128)" filter="url(#shadow-md-j)">
    <rect x="0" y="0" width="350" height="210" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <!-- Spine -->
    <rect x="0" y="0" width="10" height="210" rx="4" fill="#8b5cf6"/>
    <circle cx="5" cy="30" r="2.5" fill="#6d28d9"/>
    <circle cx="5" cy="70" r="2.5" fill="#6d28d9"/>
    <circle cx="5" cy="110" r="2.5" fill="#6d28d9"/>
    <circle cx="5" cy="150" r="2.5" fill="#6d28d9"/>
    <circle cx="5" cy="190" r="2.5" fill="#6d28d9"/>

    <!-- Page lines -->
    <line x1="26" y1="36" x2="330" y2="36" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="54" x2="330" y2="54" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="72" x2="330" y2="72" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="96" x2="330" y2="96" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="114" x2="330" y2="114" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="132" x2="330" y2="132" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="156" x2="330" y2="156" stroke="#e9e5f5" stroke-width="0.7"/>
    <line x1="26" y1="174" x2="330" y2="174" stroke="#e9e5f5" stroke-width="0.7"/>

    <!-- Entry 1: Today -->
    <text x="26" y="32" font-size="9" font-weight="600" fill="#8b5cf6" letter-spacing="1">TODAY</text>
    <text x="26" y="50" font-size="11" fill="#4a4a5a">Feeling good about the new direction.</text>
    <text x="26" y="66" font-size="11" fill="#4a4a5a">The group seems more aligned now...</text>

    <!-- Entry 2: Yesterday -->
    <text x="26" y="92" font-size="9" font-weight="600" fill="#a78bfa" letter-spacing="1">YESTERDAY</text>
    <text x="26" y="110" font-size="11" fill="#6b7280">Had a tough meeting. Need to think about</text>
    <text x="26" y="126" font-size="11" fill="#6b7280">how to approach this differently.</text>

    <!-- Entry 3: Older -->
    <text x="26" y="152" font-size="9" font-weight="600" fill="#c4b5fd" letter-spacing="1">3 DAYS AGO</text>
    <text x="26" y="170" font-size="11" fill="#9ca3af">Started the week with clarity...</text>

    <!-- Private badge -->
    <g transform="translate(288, 182)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#ede9fe"/>
      <rect x="14" y="6" width="8" height="7" rx="1.5" fill="#8b5cf6"/>
      <path d="M16,6 L16,4 A2.5,2.5 0 0,1 20,4 L20,6" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="28" y="14" font-size="7" fill="#8b5cf6">Private</text>
    </g>
  </g>

  <!-- ===== ARROW: ENTRIES TO AI ===== -->
  <g transform="translate(195, 354)">
    <circle cx="-30" cy="0" r="2.5" fill="#c4b5fd"/>
    <circle cx="-14" cy="-3" r="2" fill="#a78bfa"/>
    <circle cx="2" cy="1" r="2.5" fill="#8b5cf6"/>
    <circle cx="18" cy="-2" r="2" fill="#a78bfa"/>
    <circle cx="34" cy="2" r="2.5" fill="#c4b5fd"/>
    <line x1="44" y1="0" x2="56" y2="0" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="56,-3 62,0 56,3" fill="#8b5cf6"/>
  </g>

  <!-- ===== AI INSIGHT PANEL ===== -->
  <g transform="translate(20, 374)" filter="url(#shadow-md-j)">
    <rect x="0" y="0" width="350" height="190" rx="10" fill="#1a1a2e"/>

    <!-- Header -->
    <g transform="translate(16, 18)">
      <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#f59e0b"/>
      <text x="14" y="4" font-size="12" font-weight="600" fill="white">AI Reflection</text>
    </g>
    <line x1="16" y1="36" x2="334" y2="36" stroke="#2d2d44" stroke-width="1"/>

    <!-- Pattern -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="318" height="40" rx="6" fill="#2d2d44"/>
      <text x="10" y="14" font-size="9" font-weight="600" fill="#f59e0b" letter-spacing="1">PATTERN DETECTED</text>
      <text x="10" y="30" font-size="10" fill="#e5e7eb">You mention "alignment" 3x this week.</text>
    </g>

    <!-- Mood -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="318" height="40" rx="6" fill="#2d2d44"/>
      <text x="10" y="14" font-size="9" font-weight="600" fill="#8b5cf6" letter-spacing="1">MOOD TRAJECTORY</text>
      <polyline points="12,34 60,28 108,36 156,24 204,20 252,16 290,12" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="290" cy="12" r="2.5" fill="#8b5cf6"/>
      <text x="258" y="36" font-size="8" fill="#a78bfa">Trending up</text>
    </g>

    <!-- Streak + entries -->
    <g transform="translate(16, 150)">
      <rect x="0" y="0" width="154" height="26" rx="13" fill="#6d28d9"/>
      <text x="12" y="17" font-size="10" fill="white" font-weight="500">12-day streak</text>
      <rect x="164" y="0" width="154" height="26" rx="13" fill="#2d2d44" stroke="#4a4a5a" stroke-width="1"/>
      <text x="176" y="17" font-size="10" fill="#9ca3af">47 entries</text>
    </g>
  </g>

  <!-- ===== HOW IT WORKS ===== -->
  <text x="195" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="2">HOW IT WORKS</text>

  <!-- Row 1 -->
  <g transform="translate(20, 606)" filter="url(#shadow-sm-j)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(12, 12)">
      <rect x="0" y="2" width="10" height="8" rx="1.5" fill="#8b5cf6"/>
      <path d="M2,2 L2,0 A3,3 0 0,1 8,0 L8,2" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
    </g>
    <text x="32" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Completely Private</text>
    <text x="32" y="40" font-size="9" fill="#6b7280">Only you see your entries</text>
  </g>

  <g transform="translate(200, 606)" filter="url(#shadow-sm-j)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="12" height="12" rx="2.5" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="6" y="10" text-anchor="middle" font-size="9" fill="#8b5cf6">?</text>
    </g>
    <text x="36" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Guided Prompts</text>
    <text x="36" y="40" font-size="9" fill="#6b7280">Structured reflection cues</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(20, 670)" filter="url(#shadow-sm-j)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(14, 12)">
      <path d="M5,14 C5,14 0,9 0,5 A3.5,3.5 0 0,1 5,1.5 A3.5,3.5 0 0,1 10,5 C10,9 5,14 5,14 Z" fill="#f59e0b" opacity="0.8"/>
    </g>
    <text x="32" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Streaks</text>
    <text x="32" y="40" font-size="9" fill="#6b7280">Build a reflection habit</text>
  </g>

  <g transform="translate(200, 670)" filter="url(#shadow-sm-j)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <circle cx="0" cy="3" r="2.5" fill="#8b5cf6" opacity="0.4"/>
      <circle cx="7" cy="0" r="2.5" fill="#8b5cf6" opacity="0.6"/>
      <circle cx="14" cy="5" r="2.5" fill="#8b5cf6" opacity="0.8"/>
      <line x1="0" y1="3" x2="7" y2="0" stroke="#8b5cf6" stroke-width="0.8" opacity="0.5"/>
      <line x1="7" y1="0" x2="14" y2="5" stroke="#8b5cf6" stroke-width="0.8" opacity="0.5"/>
    </g>
    <text x="36" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Pattern Detection</text>
    <text x="36" y="40" font-size="9" fill="#6b7280">AI finds recurring themes</text>
  </g>
</svg>