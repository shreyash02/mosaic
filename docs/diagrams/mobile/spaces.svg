<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-grad-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6fef9"/>
    </linearGradient>
    <linearGradient id="space-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow-sm-s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-md-s">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="720" fill="url(#bg-grad-s)" rx="12"/>

  <!-- ===== TITLE ===== -->
  <text x="195" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981" letter-spacing="4">GATHER</text>
  <text x="195" y="74" text-anchor="middle" font-size="32" font-weight="700" fill="#1a1a2e" letter-spacing="-1">Spaces</text>
  <text x="195" y="96" text-anchor="middle" font-size="13" fill="#6b7280">A persistent place to gather thoughts. Always open.</text>
  <line x1="155" y1="110" x2="235" y2="110" stroke="#d1fae5" stroke-width="2"/>

  <!-- ===== SHARED SPACE ===== -->
  <text x="195" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="2">SHARED</text>

  <g transform="translate(20, 144)">
    <rect x="0" y="0" width="350" height="194" rx="10" fill="url(#space-floor)" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Always Open badge -->
    <g transform="translate(240, 8)">
      <rect x="0" y="0" width="96" height="22" rx="11" fill="#10b981"/>
      <circle cx="13" cy="11" r="3" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="15" font-size="9" font-weight="600" fill="white">Always Open</text>
    </g>

    <!-- Space name -->
    <text x="14" y="24" font-size="12" font-weight="700" fill="#065f46">Product Feedback</text>

    <!-- Contribution cards -->
    <g transform="translate(10, 40)" filter="url(#shadow-sm-s)">
      <rect x="0" y="0" width="158" height="54" rx="7" fill="white" stroke="#d1fae5" stroke-width="1"/>
      <circle cx="14" cy="14" r="6" fill="#10b981"/>
      <text x="26" y="16" font-size="8" fill="#6b7280">Anonymous</text>
      <text x="10" y="34" font-size="10" fill="#1a1a2e">Search needs better</text>
      <text x="10" y="46" font-size="10" fill="#4a4a5a">filters for tags.</text>
    </g>

    <g transform="translate(180, 40)" filter="url(#shadow-sm-s)">
      <rect x="0" y="0" width="158" height="54" rx="7" fill="white" stroke="#d1fae5" stroke-width="1"/>
      <circle cx="14" cy="14" r="6" fill="#60a5fa"/>
      <text x="26" y="16" font-size="8" fill="#6b7280">Anonymous</text>
      <text x="10" y="34" font-size="10" fill="#1a1a2e">Love the new dashboard!</text>
      <text x="10" y="46" font-size="10" fill="#4a4a5a">Really clean design.</text>
    </g>

    <g transform="translate(10, 102)" filter="url(#shadow-sm-s)">
      <rect x="0" y="0" width="158" height="54" rx="7" fill="white" stroke="#d1fae5" stroke-width="1"/>
      <circle cx="14" cy="14" r="6" fill="#f59e0b"/>
      <text x="26" y="16" font-size="8" fill="#6b7280">Anonymous</text>
      <text x="10" y="34" font-size="10" fill="#1a1a2e">Can we get dark mode?</text>
      <text x="10" y="46" font-size="10" fill="#4a4a5a">My eyes at 2am...</text>
    </g>

    <g transform="translate(180, 102)">
      <rect x="0" y="0" width="158" height="54" rx="7" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="79" y="24" text-anchor="middle" font-size="14" fill="#a7f3d0">+</text>
      <text x="79" y="40" text-anchor="middle" font-size="9" fill="#86efac">More arriving...</text>
    </g>

    <!-- Stats -->
    <text x="14" y="180" font-size="9" fill="#059669" font-weight="500">23 contributors</text>
    <circle cx="110" cy="177" r="1.5" fill="#a7f3d0"/>
    <text x="120" y="180" font-size="9" fill="#059669" font-weight="500">47 responses</text>
    <circle cx="210" cy="177" r="1.5" fill="#a7f3d0"/>
    <text x="220" y="180" font-size="9" fill="#059669" font-weight="500">2 weeks</text>
  </g>

  <!-- ===== OR DIVIDER ===== -->
  <line x1="195" y1="348" x2="195" y2="364" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="195" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#d1d5db">or</text>
  <line x1="195" y1="386" x2="195" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== PERSONAL SPACE ===== -->
  <text x="195" y="416" text-anchor="middle" font-size="9" font-weight="600" fill="#9ca3af" letter-spacing="2">PERSONAL</text>

  <g transform="translate(20, 426)">
    <rect x="0" y="0" width="350" height="130" rx="10" fill="#f0fdf9" stroke="#a7f3d0" stroke-width="1.5"/>

    <text x="14" y="24" font-size="12" font-weight="700" fill="#065f46">My Startup Ideas</text>

    <g transform="translate(10, 38)" filter="url(#shadow-sm-s)">
      <rect x="0" y="0" width="106" height="44" rx="6" fill="white" stroke="#d1fae5" stroke-width="1"/>
      <text x="8" y="14" font-size="8" fill="#059669" font-weight="500">You</text>
      <text x="8" y="28" font-size="9" fill="#1a1a2e">AI meeting</text>
      <text x="8" y="40" font-size="9" fill="#4a4a5a">summaries</text>
    </g>

    <g transform="translate(124, 38)" filter="url(#shadow-sm-s)">
      <rect x="0" y="0" width="106" height="44" rx="6" fill="white" stroke="#d1fae5" stroke-width="1"/>
      <text x="8" y="14" font-size="8" fill="#059669" font-weight="500">You</text>
      <text x="8" y="28" font-size="9" fill="#1a1a2e">Local meal</text>
      <text x="8" y="40" font-size="9" fill="#4a4a5a">marketplace</text>
    </g>

    <g transform="translate(238, 38)">
      <rect x="0" y="0" width="100" height="44" rx="6" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="50" y="22" text-anchor="middle" font-size="12" fill="#a7f3d0">+</text>
      <text x="50" y="36" text-anchor="middle" font-size="8" fill="#86efac">Next idea...</text>
    </g>

    <!-- Solo indicator -->
    <g transform="translate(14, 98)">
      <circle cx="6" cy="6" r="6" fill="#059669" opacity="0.7"/>
      <text x="20" y="10" font-size="9" fill="#6b7280" font-style="italic">Just you  ·  3 ideas  ·  3 months</text>
    </g>
  </g>

  <!-- ===== WHAT MAKES A SPACE ===== -->
  <text x="195" y="582" text-anchor="middle" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="2">WHAT MAKES A SPACE</text>

  <!-- Row 1 -->
  <g transform="translate(20, 596)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(14, 12)">
      <path d="M0,5 C0,0 5,-1.5 8,3 C11,-1.5 16,0 16,5 C16,10 8,12 8,7 C8,12 0,10 0,5 Z" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>
    <text x="36" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Persistent</text>
    <text x="36" y="40" font-size="9" fill="#6b7280">No close date. Always open.</text>
  </g>

  <g transform="translate(200, 596)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="10" height="14" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="8" cy="8" r="1" fill="#10b981"/>
      <line x1="16" y1="7" x2="22" y2="7" stroke="#10b981" stroke-width="1.2"/>
      <polyline points="19,4 22,7 19,10" fill="none" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="42" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Drop-in</text>
    <text x="42" y="40" font-size="9" fill="#6b7280">Contribute anytime.</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(20, 660)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(14, 12)">
      <circle cx="4" cy="4" r="4" fill="#10b981" opacity="0.7"/>
      <text x="12" y="6" font-size="9" fill="#10b981" font-weight="500">|</text>
      <circle cx="20" cy="4" r="3.5" fill="#10b981" opacity="0.4"/>
      <circle cx="28" cy="4" r="3.5" fill="#10b981" opacity="0.4"/>
    </g>
    <text x="50" y="22" font-size="11" font-weight="600" fill="#1a1a2e">Solo or Shared</text>
    <text x="50" y="40" font-size="9" fill="#6b7280">Your ideas, or many.</text>
  </g>

  <g transform="translate(200, 660)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="170" height="56" rx="8" fill="#1a1a2e"/>
    <g transform="translate(16, 14)">
      <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#f59e0b"/>
    </g>
    <text x="30" y="22" font-size="11" font-weight="600" fill="white">Periodic Digests</text>
    <text x="30" y="40" font-size="9" fill="#9ca3af">AI summarizes on schedule.</text>
  </g>
</svg>