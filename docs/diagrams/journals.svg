<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-grad-j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8ff"/>
    </linearGradient>
    <filter id="shadow-sm-j">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-md-j">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-purple">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bg-grad-j)" rx="16"/>

  <!-- ===== TITLE AREA ===== -->
  <text x="480" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#8b5cf6" letter-spacing="4">REFLECT</text>
  <text x="480" y="92" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a2e" letter-spacing="-1">Journals</text>
  <text x="480" y="118" text-anchor="middle" font-size="15" fill="#6b7280">Private reflection. AI finds the patterns you can't see yourself.</text>
  <line x1="420" y1="135" x2="540" y2="135" stroke="#ede9fe" stroke-width="2"/>

  <!-- ===== MAIN VISUAL: THE JOURNAL ===== -->

  <!-- Journal notebook (center-left) -->
  <g transform="translate(200, 180)" filter="url(#shadow-md-j)">
    <!-- Notebook cover -->
    <rect x="0" y="0" width="260" height="320" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <!-- Spine -->
    <rect x="0" y="0" width="12" height="320" rx="4" fill="#8b5cf6"/>
    <!-- Binding dots -->
    <circle cx="6" cy="40" r="3" fill="#6d28d9"/>
    <circle cx="6" cy="100" r="3" fill="#6d28d9"/>
    <circle cx="6" cy="160" r="3" fill="#6d28d9"/>
    <circle cx="6" cy="220" r="3" fill="#6d28d9"/>
    <circle cx="6" cy="280" r="3" fill="#6d28d9"/>

    <!-- Page lines -->
    <line x1="32" y1="40" x2="240" y2="40" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="60" x2="240" y2="60" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="80" x2="240" y2="80" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="100" x2="240" y2="100" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="120" x2="240" y2="120" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="140" x2="240" y2="140" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="160" x2="240" y2="160" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="180" x2="240" y2="180" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="200" x2="240" y2="200" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="220" x2="240" y2="220" stroke="#e9e5f5" stroke-width="0.8"/>
    <line x1="32" y1="240" x2="240" y2="240" stroke="#e9e5f5" stroke-width="0.8"/>

    <!-- Entry 1: Today's entry (most prominent) -->
    <text x="32" y="36" font-size="9" font-weight="600" fill="#8b5cf6" letter-spacing="1">TODAY</text>
    <text x="32" y="56" font-size="11" fill="#4a4a5a">Feeling good about the new direction.</text>
    <text x="32" y="74" font-size="11" fill="#4a4a5a">The team seems more aligned now...</text>

    <!-- Entry 2 -->
    <text x="32" y="96" font-size="9" font-weight="600" fill="#a78bfa" letter-spacing="1">YESTERDAY</text>
    <text x="32" y="116" font-size="11" fill="#6b7280">Had a tough meeting. Need to think</text>
    <text x="32" y="134" font-size="11" fill="#6b7280">about how to approach this differently.</text>

    <!-- Entry 3 -->
    <text x="32" y="156" font-size="9" font-weight="600" fill="#c4b5fd" letter-spacing="1">3 DAYS AGO</text>
    <text x="32" y="176" font-size="11" fill="#9ca3af">Started the week with clarity...</text>
    <text x="32" y="194" font-size="11" fill="#9ca3af">Focused on three key priorities.</text>

    <!-- Fading older entries -->
    <text x="32" y="216" font-size="9" font-weight="600" fill="#ddd6fe" letter-spacing="1">LAST WEEK</text>
    <text x="32" y="236" font-size="11" fill="#d1d5db">Reflecting on the quarter...</text>

    <!-- Private indicator -->
    <g transform="translate(200, 270)">
      <rect x="0" y="0" width="48" height="24" rx="12" fill="#ede9fe"/>
      <!-- Lock icon -->
      <rect x="14" y="9" width="10" height="8" rx="2" fill="#8b5cf6"/>
      <path d="M16,9 L16,6 A3,3 0 0,1 22,6 L22,9" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="30" y="16" font-size="8" fill="#8b5cf6">Private</text>
    </g>
  </g>

  <!-- ===== ARROW FROM JOURNAL TO AI ===== -->
  <g transform="translate(480, 310)">
    <!-- Flowing dots representing entries being analyzed -->
    <circle cx="0" cy="0" r="3" fill="#c4b5fd"/>
    <circle cx="16" cy="-4" r="2.5" fill="#a78bfa"/>
    <circle cx="32" cy="2" r="3" fill="#8b5cf6"/>
    <circle cx="48" cy="-2" r="2.5" fill="#a78bfa"/>
    <circle cx="64" cy="3" r="2" fill="#c4b5fd"/>
    <circle cx="78" cy="-1" r="3" fill="#8b5cf6"/>
    <line x1="90" y1="0" x2="115" y2="0" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="118,-4 126,0 118,4" fill="#8b5cf6"/>
  </g>

  <!-- ===== AI INSIGHT PANEL (right side) ===== -->
  <g transform="translate(610, 180)" filter="url(#shadow-md-j)">
    <rect x="0" y="0" width="260" height="320" rx="12" fill="#1a1a2e"/>

    <!-- AI Header -->
    <g transform="translate(20, 24)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#f59e0b"/>
      <text x="16" y="4" font-size="13" font-weight="600" fill="white">AI Reflection</text>
    </g>

    <line x1="20" y1="48" x2="240" y2="48" stroke="#2d2d44" stroke-width="1"/>

    <!-- Pattern: Recurring theme -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="220" height="56" rx="8" fill="#2d2d44"/>
      <text x="12" y="18" font-size="9" font-weight="600" fill="#f59e0b" letter-spacing="1">PATTERN DETECTED</text>
      <text x="12" y="36" font-size="11" fill="#e5e7eb">You mention "alignment" 3x this</text>
      <text x="12" y="50" font-size="11" fill="#9ca3af">week. What's driving this focus?</text>
    </g>

    <!-- Mood trend -->
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="220" height="56" rx="8" fill="#2d2d44"/>
      <text x="12" y="18" font-size="9" font-weight="600" fill="#8b5cf6" letter-spacing="1">MOOD TRAJECTORY</text>
      <!-- Mini chart -->
      <polyline points="16,48 50,42 84,50 118,36 152,32 186,28 210,24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="210" cy="24" r="3" fill="#8b5cf6"/>
      <text x="190" y="50" font-size="9" fill="#a78bfa">Trending up</text>
    </g>

    <!-- Growth signal -->
    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="220" height="56" rx="8" fill="#2d2d44"/>
      <text x="12" y="18" font-size="9" font-weight="600" fill="#10b981" letter-spacing="1">GROWTH SIGNAL</text>
      <text x="12" y="36" font-size="11" fill="#e5e7eb">Your responses to setbacks are</text>
      <text x="12" y="50" font-size="11" fill="#9ca3af">shifting from reactive to strategic.</text>
    </g>

    <!-- Streak -->
    <g transform="translate(20, 278)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#6d28d9"/>
      <text x="14" y="19" font-size="11" fill="white">12-day streak</text>
    </g>
    <g transform="translate(135, 278)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#2d2d44" stroke="#4a4a5a" stroke-width="1"/>
      <text x="14" y="19" font-size="11" fill="#9ca3af">47 entries</text>
    </g>
  </g>

  <!-- ===== FEATURES BAR ===== -->
  <text x="480" y="548" text-anchor="middle" font-size="11" font-weight="500" fill="#9ca3af" letter-spacing="2">HOW IT WORKS</text>

  <!-- Feature 1: Private -->
  <g transform="translate(100, 570)">
    <rect x="0" y="0" width="170" height="68" rx="10" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <rect x="0" y="2" width="12" height="10" rx="2" fill="#8b5cf6"/>
      <path d="M2,2 L2,-1 A4,4 0 0,1 10,-1 L10,2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    </g>
    <text x="38" y="28" font-size="12" font-weight="600" fill="#1a1a2e">Completely Private</text>
    <text x="16" y="50" font-size="10" fill="#6b7280">Only you see your entries</text>
  </g>

  <!-- Feature 2: Prompted -->
  <g transform="translate(290, 570)">
    <rect x="0" y="0" width="170" height="68" rx="10" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="7" y="11" text-anchor="middle" font-size="10" fill="#8b5cf6">?</text>
    </g>
    <text x="38" y="28" font-size="12" font-weight="600" fill="#1a1a2e">Guided Prompts</text>
    <text x="16" y="50" font-size="10" fill="#6b7280">Structured reflection cues</text>
  </g>

  <!-- Feature 3: Streaks -->
  <g transform="translate(480, 570)">
    <rect x="0" y="0" width="170" height="68" rx="10" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <path d="M7,16 C7,16 0,10 0,6 A4,4 0 0,1 7,2 A4,4 0 0,1 14,6 C14,10 7,16 7,16 Z" fill="#f59e0b" opacity="0.8"/>
    </g>
    <text x="38" y="28" font-size="12" font-weight="600" fill="#1a1a2e">Streaks</text>
    <text x="16" y="50" font-size="10" fill="#6b7280">Build a reflection habit</text>
  </g>

  <!-- Feature 4: Patterns -->
  <g transform="translate(670, 570)">
    <rect x="0" y="0" width="170" height="68" rx="10" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <circle cx="0" cy="4" r="3" fill="#8b5cf6" opacity="0.4"/>
      <circle cx="8" cy="0" r="3" fill="#8b5cf6" opacity="0.6"/>
      <circle cx="16" cy="6" r="3" fill="#8b5cf6" opacity="0.8"/>
      <line x1="0" y1="4" x2="8" y2="0" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="0" x2="16" y2="6" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    </g>
    <text x="38" y="28" font-size="12" font-weight="600" fill="#1a1a2e">Pattern Detection</text>
    <text x="16" y="50" font-size="10" fill="#6b7280">AI finds recurring themes</text>
  </g>

  <!-- Bottom tagline -->
  <text x="480" y="668" text-anchor="middle" font-size="12" fill="#9ca3af">Your private thinking space. Write freely. AI finds what you missed.</text>

  <!-- Mosaic branding -->
  <text x="480" y="700" text-anchor="middle" font-size="10" fill="#d1d5db">MOSAIC</text>
</svg>