<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a2e"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bg-grad)" rx="16"/>

  <!-- ===== TITLE AREA ===== -->
  <text x="480" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#3b82f6" letter-spacing="4">ASK</text>
  <text x="480" y="92" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a2e" letter-spacing="-1">Conversations</text>
  <text x="480" y="118" text-anchor="middle" font-size="15" fill="#6b7280">One asks. Many answer. AI reveals what matters.</text>
  <line x1="420" y1="135" x2="540" y2="135" stroke="#dbeafe" stroke-width="2"/>

  <!-- ===== MAIN VISUAL: THE EXCHANGE ===== -->

  <!-- Creator (left side) -->
  <g transform="translate(160, 240)">
    <circle cx="0" cy="-12" r="22" fill="#1e40af"/>
    <rect x="-18" y="14" width="36" height="28" rx="10" fill="#1e40af"/>
    <text x="0" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Creator</text>
  </g>

  <!-- Creator's question bubble -->
  <g transform="translate(240, 195)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="140" height="70" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="-8,30 4,24 4,36" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-1" y="23" width="6" height="14" fill="#dbeafe"/>
    <text x="70" y="30" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">"What should</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">we improve?"</text>
  </g>

  <!-- Flow arrow: Question going out -->
  <line x1="395" y1="230" x2="455" y2="230" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- Participants (right side) -->
  <!-- Participant 1 -->
  <g transform="translate(560, 195)">
    <circle cx="0" cy="-10" r="16" fill="#3b82f6"/>
    <rect x="-13" y="10" width="26" height="20" rx="8" fill="#3b82f6"/>
  </g>
  <!-- Participant 2 -->
  <g transform="translate(620, 215)">
    <circle cx="0" cy="-10" r="16" fill="#60a5fa"/>
    <rect x="-13" y="10" width="26" height="20" rx="8" fill="#60a5fa"/>
  </g>
  <!-- Participant 3 -->
  <g transform="translate(590, 260)">
    <circle cx="0" cy="-10" r="16" fill="#93c5fd"/>
    <rect x="-13" y="10" width="26" height="20" rx="8" fill="#93c5fd"/>
  </g>
  <!-- Participant 4 -->
  <g transform="translate(540, 265)">
    <circle cx="0" cy="-10" r="16" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1"/>
    <rect x="-13" y="10" width="26" height="20" rx="8" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1"/>
  </g>
  <text x="575" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">Participants</text>

  <!-- Response bubbles coming back -->
  <g transform="translate(680, 180)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="120" height="34" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="60" y="22" text-anchor="middle" font-size="10" fill="#3b82f6">"Better onboarding"</text>
  </g>
  <g transform="translate(700, 222)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="110" height="34" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="55" y="22" text-anchor="middle" font-size="10" fill="#3b82f6">"Faster deploys"</text>
  </g>
  <g transform="translate(690, 264)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="130" height="34" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="65" y="22" text-anchor="middle" font-size="10" fill="#3b82f6">"More documentation"</text>
  </g>

  <!-- ===== LIFECYCLE FLOW ===== -->
  <g transform="translate(480, 370)">
    <text x="0" y="-12" text-anchor="middle" font-size="11" font-weight="500" fill="#9ca3af" letter-spacing="2">LIFECYCLE</text>

    <!-- Create -->
    <circle cx="-240" cy="25" r="20" fill="#1e40af"/>
    <text x="-240" y="30" text-anchor="middle" font-size="18" fill="white">1</text>
    <text x="-240" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Create</text>

    <line x1="-215" y1="25" x2="-125" y2="25" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Collect -->
    <circle cx="-100" cy="25" r="20" fill="#2563eb"/>
    <text x="-100" y="30" text-anchor="middle" font-size="18" fill="white">2</text>
    <text x="-100" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Collect</text>

    <line x1="-75" y1="25" x2="15" y2="25" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Close -->
    <circle cx="40" cy="25" r="20" fill="#3b82f6"/>
    <text x="40" y="30" text-anchor="middle" font-size="18" fill="white">3</text>
    <text x="40" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Close</text>

    <line x1="65" y1="25" x2="155" y2="25" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Analyze -->
    <circle cx="180" cy="25" r="20" fill="#60a5fa"/>
    <text x="180" y="30" text-anchor="middle" font-size="18" fill="white">4</text>
    <text x="180" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Analyze</text>

    <!-- AI sparkle on Analyze -->
    <g transform="translate(208, 5)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#f59e0b" opacity="0.9"/>
    </g>
  </g>

  <!-- ===== SUB-FEATURES ===== -->
  <text x="480" y="480" text-anchor="middle" font-size="11" font-weight="500" fill="#9ca3af" letter-spacing="2">CAPABILITIES</text>

  <!-- Templates -->
  <g transform="translate(80, 505)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="152" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Template icon: stacked pages -->
    <g transform="translate(20, 20)">
      <rect x="4" y="0" width="22" height="28" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
      <rect x="0" y="4" width="22" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="5" y1="14" x2="17" y2="14" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="5" y1="20" x2="14" y2="20" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="5" y1="26" x2="11" y2="26" stroke="#3b82f6" stroke-width="1.5"/>
    </g>
    <text x="20" y="72" font-size="13" font-weight="600" fill="#1a1a2e">Templates</text>
    <text x="20" y="88" font-size="10" fill="#6b7280">Reusable starters</text>
  </g>

  <!-- Recurring -->
  <g transform="translate(252, 505)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="152" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Recurring icon: two well-separated curved arrows -->
    <g transform="translate(28, 28)">
      <!-- Top arc: right to left, curving upward -->
      <path d="M10,-3 C10,-16 -10,-16 -10,-3" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <!-- Arrowhead at left end pointing down -->
      <polygon points="-14,-5 -9,-1 -7,-7" fill="#3b82f6"/>

      <!-- Bottom arc: left to right, curving downward -->
      <path d="M-10,3 C-10,16 10,16 10,3" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
      <!-- Arrowhead at right end pointing up -->
      <polygon points="14,5 9,1 7,7" fill="#3b82f6"/>
    </g>
    <text x="20" y="72" font-size="13" font-weight="600" fill="#1a1a2e">Recurring</text>
    <text x="20" y="88" font-size="10" fill="#6b7280">Scheduled repeats</text>
  </g>

  <!-- Follow-ups -->
  <g transform="translate(424, 505)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="152" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Follow-up icon: chain of three conversations -->
    <g transform="translate(18, 14)">
      <!-- Conversation 1 -->
      <rect x="0" y="2" width="11" height="16" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="3" y1="7" x2="8" y2="7" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <line x1="3" y1="11" x2="7" y2="11" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

      <!-- Arrow 1 -->
      <line x1="14" y1="10" x2="17" y2="10" stroke="#3b82f6" stroke-width="1.5"/>
      <polyline points="16,7.5 18.5,10 16,12.5" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Conversation 2 -->
      <rect x="21" y="2" width="11" height="16" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="24" y1="7" x2="29" y2="7" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <line x1="24" y1="11" x2="28" y2="11" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

      <!-- Arrow 2 -->
      <line x1="35" y1="10" x2="38" y2="10" stroke="#3b82f6" stroke-width="1.5"/>
      <polyline points="37,7.5 39.5,10 37,12.5" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Conversation 3 -->
      <rect x="42" y="2" width="11" height="16" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="45" y1="7" x2="50" y2="7" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <line x1="45" y1="11" x2="49" y2="11" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    </g>
    <text x="20" y="72" font-size="13" font-weight="600" fill="#1a1a2e">Follow-ups</text>
    <text x="20" y="88" font-size="10" fill="#6b7280">Chain of dialogues</text>
  </g>

  <!-- Anonymity -->
  <g transform="translate(596, 505)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="152" height="100" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Anonymity icon: mask/shield -->
    <g transform="translate(26, 22)">
      <path d="M0,-14 L14,0 L10,14 L-10,14 L-14,0 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="-4" cy="0" r="2.5" fill="#1e40af"/>
      <circle cx="4" cy="0" r="2.5" fill="#1e40af"/>
      <path d="M-3,6 Q0,10 3,6" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="20" y="72" font-size="13" font-weight="600" fill="#1a1a2e">Anonymity</text>
    <text x="20" y="88" font-size="10" fill="#6b7280">4 privacy levels</text>
  </g>

  <!-- Analysis -->
  <g transform="translate(768, 505)" filter="url(#shadow-sm)">
    <rect x="0" y="0" width="112" height="100" rx="12" fill="#1a1a2e"/>
    <!-- AI sparkle icon -->
    <g transform="translate(26, 28)">
      <path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z" fill="#f59e0b"/>
      <path d="M10,-8 L11,-5 L14,-4 L11,-3 L10,0 L9,-3 L6,-4 L9,-5 Z" fill="#fbbf24" opacity="0.7"/>
    </g>
    <text x="20" y="72" font-size="13" font-weight="600" fill="white">Analysis</text>
    <text x="20" y="88" font-size="10" fill="#9ca3af">AI insights</text>
  </g>

  <!-- Bottom tagline -->
  <text x="480" y="650" text-anchor="middle" font-size="12" fill="#9ca3af">Start a conversation. Get honest answers. Discover what you didn't know to ask.</text>

  <!-- Mosaic branding -->
  <text x="480" y="700" text-anchor="middle" font-size="10" fill="#d1d5db">MOSAIC</text>
</svg>