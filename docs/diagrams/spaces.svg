<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg-grad-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6fef9"/>
    </linearGradient>
    <filter id="shadow-sm-s">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-md-s">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="space-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bg-grad-s)" rx="16"/>

  <!-- ===== TITLE AREA ===== -->
  <text x="480" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#10b981" letter-spacing="4">GATHER</text>
  <text x="480" y="92" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a2e" letter-spacing="-1">Spaces</text>
  <text x="480" y="118" text-anchor="middle" font-size="15" fill="#6b7280">A persistent place to gather thoughts. Yours, or from others. Always open.</text>
  <line x1="420" y1="135" x2="540" y2="135" stroke="#d1fae5" stroke-width="2"/>

  <!-- ===== MAIN VISUAL: TWO SPACES SIDE BY SIDE ===== -->

  <!-- ——— LEFT: GROUP SPACE ——— -->
  <text x="240" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="2">SHARED</text>

  <g transform="translate(30, 172)">
    <rect x="0" y="0" width="420" height="300" rx="14" fill="url(#space-floor)" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Always Open badge -->
    <g transform="translate(302, 12)">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="#10b981"/>
      <circle cx="14" cy="12" r="3.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="16" font-size="9" font-weight="600" fill="white">Always Open</text>
    </g>

    <!-- Space name -->
    <text x="20" y="28" font-size="13" font-weight="700" fill="#065f46">Product Feedback</text>

    <!-- Contribution cards -->
    <g transform="translate(16, 48)">
      <!-- Card 1 -->
      <g filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#10b981"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#10b981"/>
        <text x="32" y="18" font-size="9" fill="#6b7280">Anonymous</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">Search needs better filters</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">for tags and categories.</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(200, 0)" filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#60a5fa"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#60a5fa"/>
        <text x="32" y="18" font-size="9" fill="#6b7280">Anonymous</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">Love the new dashboard!</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">Really clean design.</text>
      </g>
    </g>

    <g transform="translate(16, 124)">
      <!-- Card 3 -->
      <g filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#f59e0b"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#f59e0b"/>
        <text x="32" y="18" font-size="9" fill="#6b7280">Anonymous</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">Can we get dark mode?</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">My eyes at 2am...</text>
      </g>
      <!-- Card 4: incoming -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="93" y="28" text-anchor="middle" font-size="16" fill="#a7f3d0">+</text>
        <text x="93" y="46" text-anchor="middle" font-size="9" fill="#86efac">More arriving...</text>
      </g>
    </g>

    <!-- People scattered -->
    <g transform="translate(30, 218)">
      <circle cx="0" cy="0" r="7" fill="#059669" opacity="0.6"/>
      <rect x="-5" y="9" width="10" height="8" rx="3" fill="#059669" opacity="0.6"/>
    </g>
    <g transform="translate(100, 228)">
      <circle cx="0" cy="0" r="7" fill="#10b981" opacity="0.5"/>
      <rect x="-5" y="9" width="10" height="8" rx="3" fill="#10b981" opacity="0.5"/>
    </g>
    <g transform="translate(200, 222)">
      <circle cx="0" cy="0" r="7" fill="#34d399" opacity="0.4"/>
      <rect x="-5" y="9" width="10" height="8" rx="3" fill="#34d399" opacity="0.4"/>
    </g>
    <g transform="translate(300, 230)">
      <circle cx="0" cy="0" r="7" fill="#6ee7b7" opacity="0.5"/>
      <rect x="-5" y="9" width="10" height="8" rx="3" fill="#6ee7b7" opacity="0.5"/>
    </g>
    <g transform="translate(380, 220)">
      <circle cx="0" cy="0" r="7" fill="#059669" opacity="0.4"/>
      <rect x="-5" y="9" width="10" height="8" rx="3" fill="#059669" opacity="0.4"/>
    </g>

    <!-- Stats -->
    <g transform="translate(20, 272)">
      <text x="0" y="0" font-size="9" fill="#059669" font-weight="500">23 contributors</text>
      <circle cx="100" cy="-3" r="1.5" fill="#a7f3d0"/>
      <text x="110" y="0" font-size="9" fill="#059669" font-weight="500">47 responses</text>
      <circle cx="200" cy="-3" r="1.5" fill="#a7f3d0"/>
      <text x="210" y="0" font-size="9" fill="#059669" font-weight="500">2 weeks</text>
    </g>
  </g>

  <!-- ——— DIVIDER ——— -->
  <text x="480" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#d1d5db">or</text>
  <line x1="480" y1="195" x2="480" y2="310" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="345" x2="480" y2="460" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ——— RIGHT: SOLO SPACE ——— -->
  <text x="720" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="2">PERSONAL</text>

  <g transform="translate(510, 172)">
    <rect x="0" y="0" width="420" height="300" rx="14" fill="#f0fdf9" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Always Open badge -->
    <g transform="translate(302, 12)">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="#10b981"/>
      <circle cx="14" cy="12" r="3.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="16" font-size="9" font-weight="600" fill="white">Always Open</text>
    </g>

    <!-- Space name -->
    <text x="20" y="28" font-size="13" font-weight="700" fill="#065f46">My Startup Ideas</text>

    <!-- Personal idea cards — all from "You" -->
    <g transform="translate(16, 48)">
      <!-- Idea 1 -->
      <g filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#059669"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#059669"/>
        <text x="32" y="18" font-size="9" fill="#059669" font-weight="500">You</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">AI tool that summarizes</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">meeting recordings.</text>
      </g>
      <!-- Idea 2 -->
      <g transform="translate(200, 0)" filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#059669"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#059669"/>
        <text x="32" y="18" font-size="9" fill="#059669" font-weight="500">You</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">Marketplace for local</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">home-cooked meals.</text>
      </g>
    </g>

    <g transform="translate(16, 124)">
      <!-- Idea 3 -->
      <g filter="url(#shadow-sm-s)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="white" stroke="#d1fae5" stroke-width="1"/>
        <circle cx="16" cy="16" r="8" fill="#059669"/>
        <rect x="11" y="24" width="10" height="6" rx="3" fill="#059669"/>
        <text x="32" y="18" font-size="9" fill="#059669" font-weight="500">You</text>
        <text x="14" y="40" font-size="10" fill="#1a1a2e">Neighbourhood toolkit</text>
        <text x="14" y="54" font-size="10" fill="#4a4a5a">for shared resources.</text>
      </g>
      <!-- Idea 4: next thought -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="186" height="64" rx="8" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="93" y="28" text-anchor="middle" font-size="16" fill="#a7f3d0">+</text>
        <text x="93" y="46" text-anchor="middle" font-size="9" fill="#86efac">Next idea, anytime...</text>
      </g>
    </g>

    <!-- Single person figure (solo use) -->
    <g transform="translate(50, 224)">
      <circle cx="0" cy="0" r="10" fill="#059669" opacity="0.8"/>
      <rect x="-7" y="12" width="14" height="12" rx="4" fill="#059669" opacity="0.8"/>
    </g>

    <!-- A thought line from person to cards -->
    <path d="M64,228 Q90,210 100,195" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- "Just you" label next to person -->
    <text x="80" y="244" font-size="9" fill="#6b7280" font-style="italic">Just you</text>

    <!-- Stats -->
    <g transform="translate(20, 272)">
      <text x="0" y="0" font-size="9" fill="#059669" font-weight="500">1 contributor</text>
      <circle cx="90" cy="-3" r="1.5" fill="#a7f3d0"/>
      <text x="100" y="0" font-size="9" fill="#059669" font-weight="500">3 ideas</text>
      <circle cx="155" cy="-3" r="1.5" fill="#a7f3d0"/>
      <text x="165" y="0" font-size="9" fill="#059669" font-weight="500">Running for 3 months</text>
    </g>
  </g>

  <!-- ===== KEY DIFFERENCES ===== -->
  <text x="480" y="530" text-anchor="middle" font-size="11" font-weight="500" fill="#9ca3af" letter-spacing="2">WHAT MAKES A SPACE</text>

  <!-- Difference 1: Persistent -->
  <g transform="translate(80, 555)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="185" height="80" rx="10" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <!-- Infinity symbol -->
      <path d="M0,6 C0,0 6,-2 10,4 C14,-2 20,0 20,6 C20,12 14,14 10,8 C6,14 0,12 0,6 Z" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>
    <text x="16" y="50" font-size="12" font-weight="600" fill="#1a1a2e">Persistent</text>
    <text x="16" y="68" font-size="10" fill="#6b7280">No close date. Always collecting.</text>
  </g>

  <!-- Difference 2: Drop-in -->
  <g transform="translate(285, 555)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="185" height="80" rx="10" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(16, 14)">
      <!-- Door/entry icon -->
      <rect x="2" y="0" width="14" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="13" cy="10" r="1.5" fill="#10b981"/>
      <!-- Arrow entering -->
      <line x1="22" y1="10" x2="28" y2="10" stroke="#10b981" stroke-width="1.5"/>
      <polyline points="25,7 28,10 25,13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>
    <text x="16" y="50" font-size="12" font-weight="600" fill="#1a1a2e">Drop-in</text>
    <text x="16" y="68" font-size="10" fill="#6b7280">Anyone can contribute anytime.</text>
  </g>

  <!-- Difference 3: Solo or shared -->
  <g transform="translate(490, 555)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="185" height="80" rx="10" fill="white" stroke="#d1fae5" stroke-width="1"/>
    <g transform="translate(16, 14)">
      <!-- Person solo + group icon -->
      <circle cx="6" cy="4" r="5" fill="#10b981" opacity="0.7"/>
      <text x="16" y="6" font-size="10" fill="#10b981" font-weight="500">|</text>
      <circle cx="24" cy="4" r="4" fill="#10b981" opacity="0.4"/>
      <circle cx="32" cy="4" r="4" fill="#10b981" opacity="0.4"/>
    </g>
    <text x="16" y="50" font-size="12" font-weight="600" fill="#1a1a2e">Solo or Shared</text>
    <text x="16" y="68" font-size="10" fill="#6b7280">Your ideas, or many voices.</text>
  </g>

  <!-- Difference 4: AI Digests -->
  <g transform="translate(695, 555)" filter="url(#shadow-sm-s)">
    <rect x="0" y="0" width="185" height="80" rx="10" fill="#1a1a2e"/>
    <g transform="translate(18, 18)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#f59e0b"/>
    </g>
    <text x="16" y="50" font-size="12" font-weight="600" fill="white">Periodic Digests</text>
    <text x="16" y="68" font-size="10" fill="#9ca3af">AI summarizes on schedule.</text>
  </g>

  <!-- Bottom tagline -->
  <text x="480" y="668" text-anchor="middle" font-size="12" fill="#9ca3af">Gather your own ideas or collect from others. No deadline. No conversation fatigue.</text>

  <!-- Mosaic branding -->
  <text x="480" y="700" text-anchor="middle" font-size="10" fill="#d1d5db">MOSAIC</text>
</svg>